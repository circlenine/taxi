<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAXI NOTE（下見）</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261113-9004bbf1">
</head>
<body>
<div class="pvbar">ここは<b>下見用</b>のページです。本番は
  <a href="/">こちら</a>。まだ本番には反映していません。</div>
<div id="boot" class="boot">読み込んでいます…</div>

<div class="wrap" id="app" hidden>
  <!-- ★ヘッダーの組み方（まーく様のご指示・2026/11/11）
         「TAXI NOTE の下に v1.0 ／ v1.0 の右に 近日中〜 ／
           TAXI NOTE の右に ふきだしと顔」
         「不自然に左下の空白を開けないような作りにしてください」
       1段目：題 と ふきだし・顔
       2段目：版（v1.0）と、その右に一文
       3段目：名前とボタン -->
  <header>
    <!-- ★題・ふきだし・≡ は、必ず同じ1行に収めます（ご指摘・2026/11/12）。
           ≡ を画面に浮かせると、ふきだしや下の中身と必ずどこかで重なります。
           同じ行に入れてしまえば、重なりようがありません。
           場所が足りないときは、ふきだしのほうが縮みます。 -->
    <h1 class="dn">TA<span class="xg">X</span>I NOTE</h1>
    <div id="saymount" class="saymount"></div>
    <button class="fab menu" id="fabMenu" aria-label="メニュー">≡</button>
    <div class="fabsheet" id="fabSheet" hidden></div>
  </header>

  <!-- ★版・一文・称号・ボタンは、貼り付ける行の外に出します
         （ご指摘・2026/11/12「スクロールがバグってます」）。
       前は、下に進むと題の行が縮む作りにしていました。
       高さが変わると、その境目で画面がガタつきます。
       貼り付けるのは「題・ふきだし・≡」の1行だけにして、
       高さが変わらないようにしました。 -->
  <!-- ★ここは「ひとつのブロック」です（ご指示・2026/11/13）。
         「ここはひとつのブロック扱いで、灰背景もひとつでまとめて下さい」
         「称号は、ロゴ下に入れてもらって」
         「フィードバックは三の方にあるので、ここでは消して」
         「ボタン位置と、管理～を、同じ列にしてみてください」
         「指で上下に動かしたら、開いたり閉じたりできる仕様にできませんか？」
       上に指で払うと閉じ、下に払うと開きます。つまみを押しても同じです。 -->
  <div class="hsub" id="hsub">
    <div class="subline">
      <span class="ver" id="ver"></span>
      <b class="mytitle" id="me">—</b>
      <span class="sub" id="sub">近日中、誰かがワンメータを乗せたら、キラが決まります</span>
    </div>
    <div class="hrow">
      <span>ボタン位置</span>
      <button class="chip" data-hand="r">右利き</button>
      <button class="chip" data-hand="l">左利き</button>
      <span class="whoR">
        <a class="mini" id="toAdmin" href="/admin" hidden style="text-decoration:none">管理</a>
        <button class="mini" id="out">ログアウト</button>
      </span>
    </div>
    <button class="hgrab" id="hgrab" aria-label="開く・閉じる"></button>
  </div>

  <!-- ★フィードバックは、≡ の一覧からだけ行けます（ご指示・2026/11/13
         「フィードバックは三の方にあるので、ここでは消して」）。
       ≡ は、この札を見て行き先の一覧を作ります。
       上の行からは消しましたが、目に見えない形でここに残します。 -->
  <button class="chip fbtab" data-t="fb" aria-selected="false" hidden>フィードバック</button>
  <nav id="tabs">
    <button data-t="in" aria-selected="true"><b>記録</b><i>入れる・直す</i></button>
    <button data-t="hot" aria-selected="false"><b>狙い目</b><i>いま行く所</i></button>
    <button data-t="heat" aria-selected="false"><b>表グラフ</b><i>時間×乗り場</i></button>
    <button data-t="tl" aria-selected="false"><b>横棒グラフ</b><i>夜の流れ</i></button>
    <button data-t="sc" aria-selected="false"><b>折線グラフ</b><i>時刻×金額</i></button>
    <button data-t="ratio" aria-selected="false"><b>パーセント</b><i>ロング率</i></button>
    <button data-t="ev" aria-selected="false"><b><span class="dot" id="evDot" hidden></span>イベント</b><i>今日・明日</i></button>
    <button data-t="news" aria-selected="false"><b><span class="dot" id="newsDot" hidden></span>お知らせ</b><i>使い方</i></button>
  </nav>
  <!-- ★並びは 新規の記録 → 過去の記録 → 直近の記録（ご指示・2026/11/13） -->
  <div id="panesTop"></div>
  <section class="card blk" id="ktop">
    <h2>過去の記録</h2>
    <div class="ktplace">
      <select class="fsel" id="ktPlace"></select>
      <button class="chip rst" id="ktClear" hidden>すべてに戻す</button>
    </div>
    <!-- ★プルダウン以外に、字で探せるようにします（ご指示・2026/11/13）。
           打った字が入っている乗り場を、候補として下に出します。 -->
    <div class="ktfind">
      <input class="ja" id="ktFind" data-find="ktSug" placeholder="乗り場をさがす（例：梅田）">
      <div class="fsug" id="ktSug"></div>
    </div>
    <div class="ktperiod" id="ktPeriodBox"></div>
    <!-- ★ここでも、全員／自分だけを切り替えられます（ご指示・2026/11/12） -->
    <div class="chips ktmine">
      <button class="chip" data-mine="0">全員</button>
      <button class="chip" data-mine="1">自分だけ</button>
    </div>
    <div class="ktline">
      <div class="ktwhen" id="ktWhen">—</div>
      <div class="ktsum"><small>合計</small><b id="ktSum">¥0</b></div>
    </div>
    <div class="ktwho" id="ktWho">—</div>
    <div class="kpis">
      <div class="kpi"><small>記録の数</small><b id="k1">0</b></div>
      <div class="kpi"><small>1日当たり</small><b id="k2">¥0</b></div>
      <div class="kpi gr"><small>1本の平均金額</small><b id="k3">—</b></div>
      <div class="kpi"><small>アツい時間帯</small><b id="k4">—</b></div>
    </div>
    <div class="kperiod" id="kperiod">—</div>
  </section>
  <div id="panes"></div>

  <footer>
    <div class="copy">©ibakuzo!!!!!! Gevanni!!!!!! ~1night done~</div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<!-- ★記録の画面だけに出る「粛清完了」（ご指示・2026/11/12） -->
<button class="fab done" id="fabAdd" hidden><ruby>粛清<rt>きろく</rt></ruby>完了</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261113-9004bbf1"></script>
<script src="news.js?v=20261113-9004bbf1"></script>
<script src="shared.js?v=20261113-9004bbf1"></script>
<script src="app.js?v=20261113-9004bbf1"></script>
</body>
</html>
