<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAXI NOTE（下見）</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pvbar">ここは<b>下見用</b>のページです。本番は
  <a href="/">こちら</a>。まだ本番には反映していません。</div>
<div id="boot" class="boot">読み込んでいます…</div>

<div class="wrap" id="app" hidden>
  <!-- ★ヘッダーの組み方（まーく様のご指示・2026/11/11）
         「TAXI NOTE の下に v1.0 ／ v1.0 の右に 近日中〜 ／
           TAXI NOTE の右に ふきだしと顔」
         「不自然に左下の空白を開けないような作りにしてください」
       1段目：題 と ふきだし・顔
       2段目：版（v1.0）と、その右に一文
       3段目：名前とボタン -->
  <header>
    <h1 class="dn">TA<span class="xg">X</span>I NOTE</h1>
    <div id="saymount" class="saymount"></div>
    <div class="subline">
      <span class="ver" id="ver"></span>
      <span class="sub" id="sub">近日中、誰かがワンメータを乗せたら、キラが決まります</span>
    </div>
    <!-- ★称号（ポンコツ）だけ左、ボタンは右（ご指示・2026/11/11）
           右に かたまっていると、3段目だけ右に寄って見えます。
           名前を左に置くと、段の左右が そろいます。 -->
    <div class="who">
      <b id="me">—</b>
      <span class="whoR">
        <span class="badge" id="meBadge" hidden>管理者</span>
        <a class="mini" id="toAdmin" href="/admin" hidden style="text-decoration:none">管理</a>
        <button class="mini" id="out">ログアウト</button>
      </span>
    </div>
  </header>

  <!-- ★いちばん上に「期間」と「合計」を出します
       （まーく様のご指示・2026/11/12）
         「上の4つは～みたいなやり方は絶対やめてください、
           見づらすぎます
           1番上に、期間と合計を入れて
           下の方に、※1日当たりのデータではありません
           のような形にしてください」
       長い1文を読ませず、ひと目で分かる形に並べ替えました。 -->
  <div class="ktop" id="ktop" hidden>
    <div class="ktwhen" id="ktWhen">—</div>
    <div class="ktsum"><small>合計</small><b id="ktSum">¥0</b></div>
    <div class="ktwho" id="ktWho">—</div>
    <!-- ★どこの乗り場の記録かが、いちばん大事（ご指示・2026/11/12）。
         どの画面にいても、ここで すぐ切り替えられます。 -->
    <div class="ktplace"><label for="ktPlace">乗り場</label>
      <select class="fsel" id="ktPlace"></select></div>
  </div>

  <div class="kpis">
    <div class="kpi"><small>記録の数</small><b id="k1">0</b></div>
    <div class="kpi"><small>売上の合計</small><b id="k2">¥0</b></div>
    <div class="kpi gr"><small>平均 時間単価</small><b id="k3">—</b></div>
    <div class="kpi"><small>アツい時間帯</small><b id="k4">—</b></div>
  </div>
  <div class="kperiod" id="kperiod">—</div>

  <nav id="tabs">
    <button data-t="in" aria-selected="true">記録</button>
    <button data-t="hot" aria-selected="false">いまアツい</button>
    <button data-t="heat" aria-selected="false">つけ待ち一覧</button>
    <button data-t="tl" aria-selected="false">一日の流れ</button>
    <button data-t="sc" aria-selected="false">時間×金額</button>
    <button data-t="rank" aria-selected="false">集計</button>
    <button data-t="list" aria-selected="false">全記録</button>
    <button data-t="ev" aria-selected="false">イベント<span class="dot" id="evDot" hidden></span></button>
    <button data-t="news" aria-selected="false">お知らせ<span class="dot" id="newsDot" hidden></span></button>
    <button data-t="fb" aria-selected="false">フィードバック</button>
  </nav>

  <div id="panes"></div>

  <footer>
    時間単価 ＝ 金額 ÷（待ち＋乗車）× 60<br>
    0〜6時は、前の日の夜の続き（24時以降）
    <div class="copy">©ibakuzo!!!!!! Gevanni!!!!!! ~1night done~</div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="news.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
