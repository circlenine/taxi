<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TA卍I NOTE（下見）</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121A28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261124-a8f391ef">
</head>
<body>
<div class="pvbar">ここは<b>下見用</b>のページです。本番は
  <a href="/">こちら</a>。まだ本番には反映していません。</div>
<div id="boot" class="boot">
<div class="bootart">
  <div class="bstage" aria-hidden="true">
    <div class="blines"></div>
    <div class="bha">
      <span class="h1">は</span><span class="h2">は</span><span class="h3">は</span>
      <span class="h4">は</span><span class="h5">は</span><span class="h6">は</span>
    </div>
    <!-- ★顔は4人。出るたびに でたらめに1人えらびます（ご指示・2026/11/22）。
           はじめの絵は shared.js が入れ替えます。 -->
    <img class="bkira" id="bootFace" src="img/dai.png" alt="">
  </div>
  <!-- ★だれなのか分かるように、名前とひとことを出します -->
  <div class="bootwho"><b id="bootName">ダイスケ</b><i id="bootSay"></i></div>
  <div class="bootmsg">読み込んでいます…</div>
  <div class="bootnote">※これはAIによるロイヤリティフリー画像のはずです</div>
</div>
</div>

<div class="wrap" id="app" hidden>
  <!-- ★貼り付く行（ご指示・2026/11/13）
         「固定スクロールとドッキングさせる形
           （スクロール後も、タップすると、下が開く）」
       1段目：題・ふきだし・≡（いつも見えます）
       2段目：版 v1.0（ロゴのすぐ下・いつも見えます）
       3段目：灰色のブロック（▼でしまう・広げる）
       4段目：▼のつまみ -->
  <!-- ★上の帯（ご指示・2026/11/24）
         「上部分のv1.0〜メニューまでは全て取り除き
           もっと、上メニューはGoogleスクリプトと同様くらいの高さに」
       題と ≡ と【説明】だけの、低い1行にしました。
       ページの行き先は、画面の下の帯へ移しました。
       版（v1.0）は、ページの一番下の © の下へ移しました。 -->
  <!-- ★上の帯だけにしました（ご指示・2026/11/24
         「下メニューはやめて(1回でタップして移動してくれないため)、
           スクロール時に、ロゴが消えたら、上がメニューに切り替わる
           ようにして、上メニューだけにしてください」）。
       1段目＝題と時計（下へ進むと消えます）／2段目＝メニュー（always 残ります）。 -->
  <header id="hdr">
    <div class="hmain">
      <h1 class="dn"><span class="l1">TA<span class="xg">卍</span>I</span><span class="l2">NOTE</span></h1>
      <!-- ★日付・曜日・時刻・秒を、動く時計で出します（ご指示・2026/11/24）。 -->
      <div class="hclock" id="hclock"><b>—</b></div>
      <span class="hgap"></span>
      <button class="hbtn" data-lead="1" type="button" aria-label="この画面の説明">?</button>
    </div>
    <nav id="tabs" class="topnav">
      <button data-t="in" aria-selected="true"><b>記録</b></button>
      <button data-t="hot" aria-selected="false"><b>いま</b></button>
      <button data-t="g" aria-selected="false"><b>グラフ</b></button>
      <button data-t="ratio" aria-selected="false"><b>パーセント</b></button>
      <button data-t="map" aria-selected="false"><b>地図</b></button>
      <button id="fabMenu" type="button"><b>もっと</b></button>
    </nav>
    <div class="fabsheet" id="fabSheet" hidden></div>
    <div id="acctBox" hidden>
      <div class="subline"><b class="mytitle" id="me">—</b></div>
      <div class="hrow">
        <span>ボタン位置</span>
        <button class="chip" data-hand="l">左利き</button>
        <button class="chip" data-hand="r">右利き</button>
        <span class="whoR">
          <a class="mini" id="toAdmin" href="/admin" hidden style="text-decoration:none">管理</a>
          <button class="mini" id="out">ログアウト</button>
        </span>
      </div>
    </div>
  </header>

  <!-- ★「最多付け待ちの為〜」の一文は、やめました（ご指示・2026/11/24）。
         いま出ている警報・注意報があるときだけ、ここに出します。 -->
  <div class="topline"><span class="sub" id="sub"></span></div>
  <!-- ★ふきだしも、上の帯から ここへ移しました。 -->
  <div id="saymount" class="saymount"></div>

  <!-- ★フィードバックは、≡ の一覧からだけ行けます（ご指示・2026/11/13
         「フィードバックは三の方にあるので、ここでは消して」）。
       ≡ は、この札を見て行き先の一覧を作ります。
       上の行からは消しましたが、目に見えない形でここに残します。 -->
  <!-- ★【もっと】は、この並びから中身を作ります。
         元を1つにしておかないと、増やすたびに2か所 直すことになります。 -->
  <!-- ★【もっと】の中身（ご指示・2026/11/24）。
         イベントは ここへ移しました。天気のページは やめました。 -->
  <nav id="more" hidden>
    <button data-t="ev"><b><span class="dot" id="evDot" hidden></span>イベント</b><i>今日・明日</i></button>
    <button data-t="tok"><b>特定</b><i>GO・Uber・バラシ</i></button>
    <button data-t="tro"><b><span class="dot" id="troDot" hidden></span>トロフィー</b><i>集めるもの</i></button>
    <button data-t="nippo"><b>日報</b><i>写真で取り込む</i></button>
    <button data-t="news"><b><span class="dot" id="newsDot" hidden></span>お知らせ</b><i>使い方</i></button>
    <button data-t="fb"><b>フィードバック</b><i>意見を送る</i></button>
    <button data-t="set"><b>設定</b><i>知らせ・ボタン位置</i></button>
  </nav>
  <!-- ★≡ の一覧にあったものも、ここに並べました（ご指示・2026/11/16
         「三メニューにある 記録～お知らせまでを ページ内にも載せてください」）。
       10個あるので 5列×2段。そえる字は5文字までにして、
       ます目の中で折り返さないようにしています。 -->

  <!-- ★【イベント】と【お知らせ】は、画面のメニューからは外しました
         （ご指示・2026/11/13「イベントとお知らせは画面では非表示で、
           三の方には追加したままで」）。
       ≡ は この札を見て行き先の一覧を作るので、目に見えない形で残します。
       まだ読んでいないものがあるときは、≡ に赤い丸が付きます。 -->
  <!-- ★並びは 新規の記録 → 過去の記録 → 直近の記録（ご指示・2026/11/13） -->
  <!-- ★「仕掛けが止まっているかもしれません」の帯は、目次より上に出します
       （ご指示・2026/11/16）。止まっているときに一番先に見るものなので、
       目次の下にあると気づけません。目次は #panesTop の上に差し込まれるので、
       帯だけを さらに上の入れものに分けています。 -->
  <div id="wakeTop"></div>
  <div id="panesTop"></div>
  <section class="card blk" id="ktop">
    <h2>過去の記録</h2>
    <!-- ★えらぶものは、4つのプルダウンに並べました（ご指摘・2026/11/24
           「選択できなければいけない部分が抜けていたり」
             「もっと1画面でスッと映すべき部分が映せてなかったり」）。
         **営業曜日が、ここだけ えらべませんでした。** 足しました。
         平日と土日祝では売上の出方がまるで違うので、
         ここで切り替えられないと、数字を読み違えます。 -->
    <div class="ktpick">
      <label><span>乗り場</span><select class="fsel" id="ktPlace"></select></label>
      <label><span>営業曜日</span><select class="fsel" id="ktDay"></select></label>
      <label><span>期間</span><span class="ktperiod" id="ktPeriodBox"></span></label>
      <label><span>だれの</span><select class="fsel" id="ktMine">
        <option value="0">全員</option><option value="1">自分だけ</option>
      </select></label>
    </div>
    <div class="ktfind">
      <input class="ja" id="ktFind" data-find="ktSug" placeholder="乗り場をさがす（例：梅田）">
      <div class="fsug" id="ktSug"></div>
      <button class="chip rst" id="ktClear" hidden>絞り込みを解除</button>
    </div>
    <div class="ktline">
      <div class="ktwhen" id="ktWhen">—</div>
      <div class="ktsum"><small>合計</small><b id="ktSum">¥0</b></div>
    </div>
    <div class="ktwho" id="ktWho">—</div>
    <!-- ★中カテゴリーごとの件数（ご指示・2026/11/17）。
           まとめスプシのレポートの、上から2行目と同じ形です。
           「この期間、どこで何本だったか」が、1行で分かります。 -->
    <div class="ktarea" id="ktArea"></div>
    <div class="kpis">
      <div class="kpi"><small>記録の数</small><b id="k1">0</b></div>
      <div class="kpi"><small>1日当たり</small><b id="k2">¥0</b></div>
      <div class="kpi gr"><small>1本の平均金額</small><b id="k3">—</b></div>
      <!-- ★「アツい時間帯」は やめました（ご指摘・2026/11/16
             「エリア指定してないのに、アツい時間帯というのはなんなのですか？
               根拠のないデータは絶対に載せないでください」）。
           乗り場をしぼっていないと、場所がバラバラの平均になり、
           どこの話かも言えない数字でした。 -->
      <div class="kpi"><small>ロングの割合</small><b id="k4">—</b></div>
    </div>
    <div class="kperiod" id="kperiod">—</div>
    <!-- ★記録の表は、ここに出します（ご指示・2026/11/16
           「直近の記録は非表示にしてください」）。
         「直近の記録」という別の欄に、同じ乗り場えらび・同じ絞り込みが
         もう一組ならんでいて、2つの欄が同じことをしていました。
         欄を1つにして、絞り込みの すぐ下に表を置きます。 -->
    <div id="ktTbl"></div>
  </section>
  <div id="panes"></div>

  <footer>
    <div class="copy">©ibakuzo!!!!!! Gevanni!!!!!! ~1night done~</div>
    <!-- ★版は、ここに小さく（ご指示・2026/11/24
           「v1.0は、ページ一番下の©の下あたりに小さくで構いません」）。 -->
    <div class="footver"><span class="ver" id="ver"></span></div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<!-- ★右下の固定ボタンは、いったん外しました（ご指示・2026/11/16
       「また、右下の固定ボタンは一旦取り除いてください」）。
     ★消してはいません。hidden を外せば、そのまま戻ります。 -->
<button class="fab done" id="fabAdd" hidden data-off="1"><span class="lab"><span class="k">粛清<i>きろく</i></span>完了</span></button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261124-a8f391ef"></script>
<script src="news.js?v=20261124-a8f391ef"></script>
<script src="shared.js?v=20261124-a8f391ef"></script>
<script src="app.js?v=20261124-a8f391ef"></script>
</body>
</html>
