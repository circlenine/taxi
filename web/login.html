<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン｜つけ待ち台帳</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login">
  <div class="box">
    <div class="head">
      <div class="andon"><span>空車</span></div>
      <div>
        <h1>つけ待ち台帳</h1>
        <div class="sub">関係者だけが入れます</div>
      </div>
    </div>

    <!-- ふだんのログイン -->
    <div class="card" id="signin">
      <div class="grid" style="grid-template-columns:1fr">
        <div class="f">
          <label for="email">メールアドレス</label>
          <input class="ja" id="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
        </div>
        <div class="f">
          <label for="pw">パスワード</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>
      <div class="actions" style="flex-direction:column;align-items:stretch">
        <button class="btn" id="go">ログイン</button>
        <span class="msg" id="msg"></span>
      </div>
    </div>

    <!-- パスワード再設定メールの送信 -->
    <div class="card" id="forgot" hidden>
      <h2>パスワードの再設定</h2>
      <p class="note">登録しているメールアドレスに、再設定用のリンクを送ります。届くまで数分かかることがあります。迷惑メールも見てください。</p>
      <div class="f">
        <label for="remail">メールアドレス</label>
        <input class="ja" id="remail" type="email" inputmode="email" placeholder="you@example.com">
      </div>
      <div class="actions" style="flex-direction:column;align-items:stretch">
        <button class="btn" id="send">再設定リンクを送る</button>
        <span class="msg" id="msg2"></span>
      </div>
    </div>

    <!-- メールのリンクから来たとき -->
    <div class="card" id="reset" hidden>
      <h2>新しいパスワードを決める</h2>
      <p class="note">6文字以上。決めたら忘れないところに控えてください。</p>
      <div class="f">
        <label for="np">新しいパスワード</label>
        <input id="np" type="password" autocomplete="new-password">
      </div>
      <div class="actions" style="flex-direction:column;align-items:stretch">
        <button class="btn" id="save">このパスワードにする</button>
        <span class="msg" id="msg3"></span>
      </div>
    </div>

    <div class="foot" id="foot">
      <a href="#" id="toForgot">パスワードを忘れた</a><br>
      アカウントは管理者が作ります。新しく作りたいときは声をかけてください。
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="login.js"></script>
</body>
</html>
